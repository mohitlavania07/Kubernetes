kind: Job
apiVersion: batch/v1
metadata:
  name: job-task
  namespace: nginx
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 4
  template:
    metadata:
      name: demo-job-pod
      labels:
        app: batch-task
    spec:
      containers:
      - name: batch-container
        image: busybox
        command: ["sh", "-c", "echo Hello Dosto"]
      restartPolicy: Never
